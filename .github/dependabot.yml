version: 2
updates:
  - package-ecosystem: nuget
    directory: "/tests/SpecHarbor.Tests"
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
